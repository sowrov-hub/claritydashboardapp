<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="showrov.ai">
  <meta name="copyright" content="© 2025 showrov.ai. All rights reserved.">
  <meta name="product" content="Clarity Dashboard by showrov.ai">
  <title>Clarity Dashboard</title>
  <meta name="theme-color" content="#5b8ef0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="ChatGPT%20Image%20May%2019%2C%202026%2C%2003_02_46%20PM.png">
  <link rel="apple-touch-icon" href="ChatGPT%20Image%20May%2019%2C%202026%2C%2003_02_46%20PM.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #edeef2; --shell: #ffffff; --surface: #ffffff; --surface2: #f7f8fa; --surface3: #f0f1f5;
      --ink: #1a1d23; --mid: #6b7280; --soft: #9ca3af; --border: #e5e7eb; --border2: #d1d5db;
      --accent: #5b8ef0; --accent-lt: #eff4ff; --green: #16a34a; --green-lt: #f0fdf4;
      --red: #dc2626; --red-lt: #fef2f2; --amber: #d97706; --amber-lt: #fffbeb;
      --input-bg: #ffffff; --input-bdr: #5b8ef0; --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow: 0 4px 6px rgba(0,0,0,.05), 0 10px 15px rgba(0,0,0,.06);
      --shadow-lg: 0 10px 25px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.05);
      --radius: 12px; --radius-sm: 8px; --radius-xs: 6px; --sidebar-w: 220px;
    }
    html, body { height: 100%; font-size: 14px; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; }
    body.app-locked .shell, body.app-locked #copy-footer, body.app-locked .toast { display: none; }
    
    .auth-gate { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(135deg, #eff4ff 0%, #f7f8fa 52%, #f0fdf4 100%); }
    body.app-locked .auth-gate { display: flex; }
    .auth-card { width: min(100%, 400px); padding: 34px; background: #fff; border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-lg); text-align: center; }
    .auth-logo { width: 54px; height: 54px; object-fit: cover; border-radius: 14px; margin-bottom: 18px; }
    .auth-card h1 { font-size: 21px; color: var(--ink); margin-bottom: 8px; }
    .auth-card p { font-size: 12px; line-height: 1.6; color: var(--mid); margin-bottom: 22px; }
    .auth-field { text-align: left; margin-bottom: 14px; }
    .auth-field label { display: block; font-size: 11px; font-weight: 600; color: var(--mid); margin-bottom: 6px; }
    .auth-field input { width: 100%; padding: 11px 12px; border: 1px solid var(--border2); border-radius: var(--radius-xs); outline: none; font: inherit; color: var(--ink); }
    .auth-field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,142,240,.12); }
    .auth-submit { width: 100%; padding: 11px 14px; font-size: 13px; }
    .auth-error { min-height: 18px; margin-top: 12px; font-size: 11px; color: var(--red); }
    
    .shell { display: flex; flex: 1; min-height: 100vh; }
    .sidebar { width: var(--sidebar-w); background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 28px 0 24px; flex-shrink: 0; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 50; }
    .sidebar-logo { padding: 0 22px 28px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .sidebar-logo .logo-mark { width: 34px; height: 34px; border-radius: 9px; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    .sidebar-logo .logo-mark img { width: 100%; height: 100%; object-fit: cover; }
    .sidebar-logo .logo-text { font-size: 14px; font-weight: 700; color: var(--ink); line-height: 1.2; }
    .sidebar-logo .logo-sub { font-size: 10px; color: var(--soft); font-weight: 400; }
    .nav-section-label { font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); padding: 0 22px 6px; margin-top: 16px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 22px; cursor: pointer; transition: all .15s; font-size: 13px; color: var(--mid); font-weight: 500; user-select: none; position: relative; }
    .nav-item:hover { background: var(--surface2); color: var(--ink); }
    .nav-item.active { background: var(--accent-lt); color: var(--accent); }
    .nav-item.active .nav-icon { opacity: 1; }
    .nav-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; opacity: .7; }
    .sidebar-footer { margin-top: auto; padding: 16px 22px 0; border-top: 1px solid var(--border); }
    .save-status { font-size: 10.5px; padding: 8px 12px; border-radius: 8px; background: var(--surface2); color: var(--soft); font-weight: 500; text-align: center; border: 1px solid var(--border); }
    .save-status.saved { color: var(--green); background: var(--green-lt); border-color: #bbf7d0; }
    .save-status.saving { color: var(--amber); background: var(--amber-lt); border-color: #fde68a; }
    .topbar { height: 60px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #fff; flex-shrink: 0; gap: 12px; position: fixed; top: 0; left: var(--sidebar-w); right: 0; z-index: 40; box-shadow: 0 1px 0 var(--border); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
    .currency-select { background: var(--surface2); border: 1px solid var(--border); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; padding: 7px 28px 7px 11px; border-radius: var(--radius-xs); outline: none; cursor: pointer; appearance: none; min-width: 110px; }
    .btn { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; padding: 7px 14px; border-radius: var(--radius-xs); border: none; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0) scale(.97); }
    .btn-ghost { background: var(--surface2); color: var(--mid); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--surface3); color: var(--ink); border-color: var(--border2); }
    .btn-accent { background: linear-gradient(135deg,#5b8ef0,#7c6ff7); color: #fff; box-shadow: 0 2px 8px rgba(91,142,240,.3); }
    .btn-accent:hover { box-shadow: 0 4px 14px rgba(91,142,240,.4); }
    
    /* Direct Header Install Button Styling */
    #direct-install-btn { display: none; align-items: center; gap: 6px; }
    
    .main-wrapper { flex: 1; display: flex; flex-direction: column; margin-left: var(--sidebar-w); min-width: 0; }
    .main { flex: 1; padding: 28px 36px 72px; margin-top: 60px; overflow-y: auto; background: var(--bg); }
    .section { display: none; }
    .section.active { display: block; animation: fadeIn .25s cubic-bezier(.16,1,.3,1) both; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px) scale(.99); } to { opacity:1; transform:translateY(0) scale(1); } }
    .page-title { font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
    .page-subtitle { font-size: 12.5px; color: var(--soft); margin-bottom: 26px; line-height: 1.6; }
  </style>
</head>
<body>

  <!-- Auth Gate -->
  <div class="auth-gate">
    <div class="auth-card">
      <img src="ChatGPT%20Image%20May%2019%2C%202026%2C%2003_02_46%20PM.png" alt="Logo" class="auth-logo">
      <h1>Welcome to Clarity</h1>
      <p>Please enter your access key to unlock your dashboard.</p>
      <div class="auth-field">
        <label for="passcode-input">Passcode</label>
        <input type="password" id="passcode-input" placeholder="Enter password...">
      </div>
      <button id="auth-submit-btn" class="btn btn-accent auth-submit">Unlock Dashboard</button>
      <div id="auth-error" class="auth-error"></div>
    </div>
  </div>

  <!-- Shell Layout -->
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-mark">
          <img src="ChatGPT%20Image%20May%2019%2C%202026%2C%2003_02_46%20PM.png" alt="Logo">
        </div>
        <div>
          <div class="logo-text">Clarity</div>
          <div class="logo-sub">Dashboard</div>
        </div>
      </div>
      
      <div class="nav-section-label">Main Menu</div>
      <div class="nav-item active" data-section="overview">
        <span class="nav-icon">📊</span> Overview
      </div>
      
      <div class="sidebar-footer">
        <div id="save-status" class="save-status saved">All changes saved</div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <select id="currency-select" class="currency-select">
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="GBP">GBP (£)</option>
          <option value="BDT">BDT (৳)</option>
        </select>
        <div class="topbar-actions">
          <!-- Direct Header Install App Button -->
          <button id="direct-install-btn" class="btn btn-accent">📲 Install App</button>
          <button id="lock-app-btn" class="btn btn-ghost">Lock App</button>
        </div>
      </header>

      <main class="main">
        <section id="overview" class="section active">
          <h1 class="page-title">Dashboard Overview</h1>
          <p class="page-subtitle">Welcome back. Here is your operational summary.</p>
        </section>
      </main>
    </div>
  </div>

  <!-- Service Worker & Direct Install Script -->
  <script>
    // 1. Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('Service Worker registered:', reg.scope))
          .catch(err => console.error('SW registration failed:', err));
      });
    }

    // 2. Direct Install Handler (twopurse style)
    let deferredPrompt;
    const directInstallBtn = document.getElementById('direct-install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent automatic browser mini-infobar
      e.preventDefault();
      // Store event
      deferredPrompt = e;
      // Show topbar button directly
      if (directInstallBtn) {
        directInstallBtn.style.display = 'inline-flex';
      }
    });

    if (directInstallBtn) {
      directInstallBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;

        // Immediately launch native browser prompt dialog
        deferredPrompt.prompt();

        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response to install: ${outcome}`);

        // Hide button after user interacts
        deferredPrompt = null;
        directInstallBtn.style.display = 'none';
      });
    }

    window.addEventListener('appinstalled', () => {
      console.log('App successfully installed!');
      deferredPrompt = null;
      if (directInstallBtn) {
        directInstallBtn.style.display = 'none';
      }
    });
  </script>
</body>
</html>
